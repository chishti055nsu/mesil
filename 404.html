<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | MESIL Lab</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('mesil-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    })();
  </script>
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 24px;">
  <div class="ambient-glow" aria-hidden="true">
    <div class="ambient-blob-1"></div>
    <div class="ambient-blob-2"></div>
    <div class="ambient-grid"></div>
  </div>

  <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 48px; max-width: 560px; box-shadow: var(--shadow-md); backdrop-filter: blur(16px);">
    <div style="font-family: var(--font-display); font-size: 5rem; font-weight: 800; line-height: 1;" class="text-gradient">
      404
    </div>
    <h1 style="font-size: 1.8rem; margin: 16px 0 12px;">Research Node Not Found</h1>
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 28px; line-height: 1.6;">
      The requested scientific page or publication node does not exist or has been relocated within the MESIL digital repository.
    </p>
    <a href="index.html" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Return to MESIL Home
    </a>
  </div>
</body>
</html>
